<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Geometry Learning with WEB AR</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg-0:#070b14;
    --bg-1:#0d1526;
    --panel:#0f1728;
    --panel-border:rgba(148,163,184,.14);
    --panel-hover:rgba(96,165,250,.09);
    --panel-active:rgba(59,130,246,.16);
    --text:#e8ecf6;
    --text-dim:#8b96ab;
    --blue:#3b82f6;
    --blue-light:#7fb2ff;
    --amber:#f6b93b;
    --purple:#a78bfa;
    --pink:#f472b6;
    --radius-lg:18px;
    --radius-md:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:'Prompt',sans-serif;background:var(--bg-0);color:var(--text);}
  button{font-family:inherit;}

  .app{display:flex;flex-direction:column;width:100vw;height:100vh;}

  /* ---------- LOGIN / SPLASH SCREEN ---------- */
  .app.login-active .topbar,
  .app.login-active .sidebar{display:none;}

  #loginScreen{
    position:absolute;inset:0;z-index:90;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:20px;text-align:center;cursor:pointer;
    transition:opacity .45s ease;
  }
  #loginScreen.fade-out{opacity:0;pointer-events:none;}
  .login-title-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
  #loginScreen h1{
    font-size:2.6rem;font-weight:700;line-height:1.4;margin:0;max-width:760px;
    background:linear-gradient(135deg,#ffffff 0%,#60a5fa 50%,#93c5fd 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    text-shadow:0 4px 20px rgba(59,130,246,.2);
  }
  #loginScreen .login-sub{font-size:.85rem;color:var(--text-dim);font-weight:300;}
  .login-enter-btn{
    position:absolute;left:50%;bottom:64px;transform:translateX(-50%);
    display:inline-flex;align-items:center;gap:10px;
    font-size:1.05rem;color:#93c5fd;font-weight:400;
    padding:13px 30px;background:rgba(59,130,246,.12);
    border:1px solid rgba(96,165,250,.32);border-radius:30px;
    backdrop-filter:blur(8px);cursor:pointer;
    animation:pulseGlow 2s infinite ease-in-out;
  }
  .login-enter-btn:hover{background:rgba(59,130,246,.2);}
  /* hide the idle "choose a model" hint while the login splash is showing */
  .app.login-active .idle-overlay{display:none;}
  @media (max-width:760px){
    #loginScreen h1{font-size:1.8rem;}
    .login-enter-btn{bottom:36px;}
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;
    background:linear-gradient(180deg, rgba(13,21,38,.95), rgba(13,21,38,.75));
    border-bottom:1px solid var(--panel-border);
    z-index:20;
    flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    background:conic-gradient(from 220deg, var(--blue), var(--purple), var(--pink), var(--blue));
    box-shadow:0 0 16px rgba(59,130,246,.45);
  }
  .brand h1{font-size:1.02rem;font-weight:600;margin:0;letter-spacing:.2px;}
  .brand span{display:block;font-size:.72rem;color:var(--text-dim);font-weight:300;}

  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--panel-border);
    background:rgba(255,255,255,.03);color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s, color .15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.08);color:var(--text);}
  .icon-btn.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .ar-btn{
    display:flex;align-items:center;gap:8px;
    padding:9px 18px;border:none;border-radius:22px;cursor:pointer;
    background:linear-gradient(135deg,var(--pink),var(--purple));
    color:#fff;font-weight:600;font-size:.88rem;
    box-shadow:0 6px 18px rgba(236,72,153,.28);
    transition:transform .15s;
  }
  .ar-btn.on{background:linear-gradient(135deg,#16a34a,#0ea5e9);}
  .ar-btn:hover{transform:translateY(-1px);}

  /* ---------- BODY LAYOUT ---------- */
  .body{flex:1;display:flex;min-height:0;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:250px;flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--panel-border);
    display:flex;flex-direction:column;
    padding:16px 14px;
    overflow:hidden;
  }
  .dim-tabs{
    display:flex;background:rgba(255,255,255,.04);
    border-radius:12px;padding:4px;gap:4px;margin-bottom:16px;flex-shrink:0;
  }
  .dim-tab{
    flex:1;border:none;background:transparent;color:var(--text-dim);
    font-size:.8rem;font-weight:500;padding:9px 6px;border-radius:9px;cursor:pointer;
    transition:background .18s, color .18s;
  }
  .dim-tab.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,.35);}

  .sidebar-label{
    font-size:.72rem;color:var(--text-dim);font-weight:400;
    margin:2px 2px 10px;
  }

  .shape-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px;}
  .shape-list::-webkit-scrollbar{width:5px;}
  .shape-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px;}

  .shape-card{
    display:flex;align-items:center;gap:12px;
    padding:10px 11px;border-radius:var(--radius-md);
    border:1px solid transparent;background:rgba(255,255,255,.02);
    cursor:pointer;text-align:left;
    transition:background .15s, border-color .15s, transform .1s;
  }
  .shape-card:hover{background:var(--panel-hover);}
  .shape-card.active{background:var(--panel-active);border-color:rgba(96,165,250,.4);}
  .shape-swatch{
    width:36px;height:36px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.05);
  }
  .shape-swatch svg{width:22px;height:22px;}
  .shape-meta{min-width:0;}
  .shape-meta .th{font-size:.86rem;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .shape-meta .en{font-size:.68rem;color:var(--text-dim);font-weight:300;}

  /* custom-model builder entry card (sits after the last preset shape) */
  .shape-card.custom-card{
    margin-top:6px;padding-top:14px;border-top:1px dashed var(--panel-border);
  }
  .shape-card.custom-card .shape-swatch{background:rgba(59,130,246,.14);}

  /* ---------- MAIN VIEWPORT ---------- */
  .viewport{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 42%, var(--bg-1) 0%, var(--bg-0) 78%);}
  #three-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;}
  #three-canvas.grabbing{cursor:grabbing;}

  /* ---------- CAMERA PREVIEW (pseudo-AR) ---------- */
  #camPreview{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;
  }
  #camPreview.show{display:block;}
  .ar-hint{
    position:absolute;left:50%;bottom:84px;z-index:16;transform:translateX(-50%);
    display:none;padding:10px 16px;border-radius:22px;
    color:#fff;background:rgba(15,23,40,.78);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.18);font-size:.8rem;white-space:nowrap;
  }
  .ar-hint.show{display:block;}

  .svg-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1100px;}
  .svg-stage.hidden{display:none;}
  .svg-stage svg{width:min(46vw,380px);height:min(46vw,380px);filter:drop-shadow(0 14px 26px rgba(59,130,246,.25));}
  #svgFlip{display:flex;align-items:center;justify-content:center;transform-style:preserve-3d;will-change:transform;cursor:grab;}
  #svgFlip.grabbing{cursor:grabbing;}

  .idle-overlay{
    position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
    pointer-events:none;padding-bottom:64px;
    opacity:1;transition:opacity .35s ease;
  }
  .idle-overlay.hidden{opacity:0;}
  .idle-hint{
    display:inline-flex;align-items:center;gap:10px;
    padding:11px 24px;border-radius:30px;
    background:rgba(59,130,246,.1);border:1px solid rgba(96,165,250,.28);
    color:var(--blue-light);font-size:.92rem;backdrop-filter:blur(6px);
    animation:pulseGlow 2.4s infinite ease-in-out;
  }
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 0 14px rgba(59,130,246,.18);}
    50%{box-shadow:0 0 24px rgba(59,130,246,.42);}
  }

  /* floating V/E/F chips */
  .label-layer{position:absolute;inset:0;pointer-events:none;display:none;}
  .label-layer.show{display:block;}
  .chip{
    position:absolute;text-align:center;font-size:.92rem;font-weight:500;
    line-height:1.35;transform:translate(-50%,-50%);
    text-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  .chip small{display:block;font-size:.66rem;font-weight:300;opacity:.75;letter-spacing:.3px;}
  .chip.edge{color:#dfe8fb;}
  .chip.vertex{color:var(--amber);}
  .chip.face{color:#f4f7ff;}

  /* ---------- TOOLBAR ---------- */
  .toolbar{
    position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
    display:flex;gap:10px;z-index:15;
    opacity:0;pointer-events:none;transition:opacity .3s ease, transform .3s ease;
  }
  .toolbar.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
  .toolbar:not(.show){transform:translateX(-50%) translateY(10px);}
  .toolbar{max-width:calc(100vw - 28px);overflow-x:auto;scrollbar-width:none;}
  .toolbar::-webkit-scrollbar{display:none;}
  .tool-btn{
    display:flex;align-items:center;gap:8px;
    padding:11px 18px;border-radius:24px;border:1px solid var(--panel-border);
    background:rgba(15,23,40,.82);backdrop-filter:blur(8px);
    color:var(--text);font-size:.84rem;cursor:pointer;
    transition:background .15s,border-color .15s,transform .1s;
  }
  .tool-btn svg{width:16px;height:16px;flex-shrink:0;}
  .tool-btn:hover{transform:translateY(-1px);}
  .tool-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;}
  .tool-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}

  /* ---------- SIDE PANEL (info / formula / net / build) ---------- */
  .side-panel{
    position:absolute;top:0;right:0;height:100%;width:320px;max-width:82vw;
    background:rgba(10,15,28,.94);backdrop-filter:blur(10px);
    border-left:1px solid var(--panel-border);
    transform:translateX(100%);transition:transform .28s ease;
    z-index:18;padding:22px;overflow-y:auto;
  }
  .side-panel.open{transform:translateX(0);}
  .side-panel h2{font-size:1.05rem;margin:0 0 4px;font-weight:600;}
  .side-panel .subtitle{font-size:.76rem;color:var(--text-dim);margin-bottom:18px;font-weight:300;}
  .side-panel .close-x{
    position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:50%;
    border:none;background:rgba(255,255,255,.06);color:var(--text-dim);cursor:pointer;
  }
  .stat-row{display:flex;gap:8px;margin-bottom:18px;}
  .stat-pill{flex:1;text-align:center;padding:10px 4px;border-radius:10px;background:rgba(255,255,255,.04);}
  .stat-pill b{display:block;font-size:1.2rem;}
  .stat-pill span{font-size:.66rem;color:var(--text-dim);}
  .panel-section{margin-bottom:18px;}
  .panel-section h3{font-size:.78rem;text-transform:none;color:var(--text-dim);font-weight:400;margin:0 0 8px;}
  .formula-box{
    background:rgba(255,255,255,.04);border:1px solid var(--panel-border);
    border-radius:10px;padding:12px 14px;font-size:.9rem;margin-bottom:10px;
  }
  .formula-box .fname{color:var(--blue-light);font-size:.72rem;display:block;margin-bottom:4px;}
  .desc-text{font-size:.85rem;line-height:1.65;color:#c9d2e3;font-weight:300;}
  .net-visual{width:100%;border-radius:10px;background:rgba(255,255,255,.03);padding:14px;margin-bottom:12px;}
  .net-visual svg{width:100%;height:auto;display:block;}

  /* ---------- CUSTOM MODEL BUILDER PANEL ---------- */
  .preset-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .preset-pill{
    background:rgba(255,255,255,.04);border:1px solid var(--panel-border);
    color:#cbd5e1;font-size:.78rem;font-weight:400;padding:7px 13px;border-radius:16px;
    cursor:pointer;transition:all .18s ease;white-space:nowrap;
  }
  .preset-pill:hover{background:rgba(255,255,255,.09);color:#fff;}
  .preset-pill.active{background:var(--blue);border-color:var(--blue-light);color:#fff;font-weight:500;box-shadow:0 0 10px rgba(59,130,246,.35);}
  .select-hint{
    font-size:.78rem;color:#93c5fd;background:rgba(59,130,246,.1);
    border:1px dashed rgba(96,165,250,.35);border-radius:10px;padding:10px 12px;line-height:1.55;
  }
  .selected-tag{
    display:inline-block;font-size:.72rem;color:var(--blue-light);background:rgba(59,130,246,.12);
    border:1px solid rgba(96,165,250,.3);border-radius:12px;padding:4px 10px;margin-bottom:12px;
  }
  .axis-label{font-size:.76rem;color:var(--text-dim);margin-bottom:8px;}
  .axis-row{display:flex;gap:10px;margin-bottom:4px;}
  .axis-row > div{flex:1;}
  .axis-row label{display:block;font-size:.7rem;color:var(--text-dim);margin-bottom:5px;}
  .axis-row input{
    width:100%;background:rgba(0,0,0,.28);border:1px solid var(--panel-border);
    color:var(--text);font-size:.86rem;padding:9px 10px;border-radius:9px;
    font-family:monospace;outline:none;transition:border .18s ease;
  }
  .axis-row input:focus{border-color:var(--blue);}
  .axis-row input.invalid{border-color:#f87171 !important;background:rgba(248,113,113,.1);}
  .generate-btn{
    width:100%;background:var(--blue);border:none;color:#fff;font-size:.86rem;font-weight:500;
    padding:11px;border-radius:10px;cursor:pointer;transition:background .18s ease;margin-top:10px;
  }
  .generate-btn:hover{background:#2563eb;}
  .axis-error{font-size:.72rem;color:#f87171;margin-top:8px;display:none;}
  .axis-hint{font-size:.68rem;color:#64748b;margin-top:10px;line-height:1.55;}

  @media (max-width:760px){
    .app{height:100dvh;min-height:100vh;}
    .topbar{padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top));gap:8px;}
    .brand{min-width:0;}
    .brand h1{max-width:150px;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .brand span{display:none;}
    .topbar-actions{gap:6px;flex-shrink:0;}
    #helpBtn{display:none;}
    #cameraPreviewBtn{display:none;}
    .ar-btn{width:46px;height:38px;padding:0;justify-content:center;font-size:0;gap:0;white-space:nowrap;}
    .ar-btn svg{width:18px;height:18px;}
    .sidebar{position:absolute;left:0;top:0;bottom:0;z-index:25;transform:translateX(-100%);transition:transform .25s ease;box-shadow:12px 0 30px rgba(0,0,0,.4);}
    .sidebar.open{transform:translateX(0);}
    .sidebar-backdrop{display:block;position:fixed;inset:0;z-index:24;background:rgba(0,0,0,.48);opacity:0;pointer-events:none;transition:opacity .25s ease;}
    .sidebar-backdrop.show{opacity:1;pointer-events:auto;}
    .toolbar{left:12px;right:12px;bottom:max(12px, env(safe-area-inset-bottom));width:auto;max-width:none;transform:translateY(10px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:6px;border:1px solid rgba(148,163,184,.2);border-radius:18px;background:rgba(7,11,20,.9);}
    .toolbar.show{transform:translateY(0);}
    .toolbar:not(.show){transform:translateY(10px);}
    .tool-btn{width:100%;min-width:0;height:52px;padding:4px 2px;justify-content:center;flex-direction:column;gap:2px;border-radius:12px;}
    .tool-btn span.tbl-txt{display:none;}
    .tool-btn span.tbl-txt{display:block;font-size:.58rem;line-height:1.1;white-space:nowrap;}
    .side-panel{width:100vw;max-width:100vw;}
    .ar-hint{bottom:72px;max-width:calc(100vw - 24px);white-space:normal;text-align:center;}
  }
</style>
</head>
<body>
<div class="app login-active">

  <header class="topbar">
    <div class="brand">
      <button class="icon-btn" id="sidebarToggle" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="brand-mark"></div>
      <div>
        <h1>Geometry Learning with WEB AR</h1>
        <span>สื่อการเรียนรู้เรขาคณิตด้วยเทคโนโลยีความเป็นจริงเสริม</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="helpBtn" title="ช่วยเหลือ">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 9.2a2.5 2.5 0 0 1 4.9.7c0 1.6-2.2 1.6-2.4 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="17" r="0.9" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="cameraPreviewBtn" title="โหมดกล้อง (พรีวิวคล้าย AR)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="14" r="3.4" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="ar-btn" id="arModeBtn" type="button" title="เปิดหรือปิดโหมด AR">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 2l1.6 4.8L18 8l-4.4 1.2L12 14l-1.6-4.8L6 8l4.4-1.2L12 2z" fill="#fff"/></svg>
        เข้าสู่โหมด AR
      </button>
    </div>
  </header>

  <div class="body">

    <aside class="sidebar" id="sidebar">
      <div class="dim-tabs">
        <button class="dim-tab active" data-dim="3d">โมเดล 3 มิติ</button>
        <button class="dim-tab" data-dim="2d">โมเดล 2 มิติ</button>
      </div>
      <div class="sidebar-label" id="sidebarLabel">เลือกรูปทรงเพื่อเริ่มเรียนรู้</div>
      <div class="shape-list" id="shapeList"></div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="viewport">
      <video id="camPreview" autoplay playsinline muted></video>
      <canvas id="three-canvas"></canvas>
      <div class="ar-hint" id="arHint">เล็งกล้องไปที่พื้น แล้วแตะเพื่อวางโมเดล</div>
      <div class="svg-stage hidden" id="svgStage"><div id="svgFlip"></div></div>

      <div class="idle-overlay" id="idleOverlay">
        <div class="idle-hint">
          <span>เลือกโมเดลด้านซ้ายเพื่อเริ่มต้นสำรวจรูปทรง</span>
        </div>
      </div>

      <div class="label-layer" id="labelLayer"></div>

      <div class="toolbar">
        <button class="tool-btn" data-tool="label" id="toolLabelBtn">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 12l7-7h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-7-7z" stroke="currentColor" stroke-width="1.6"/><circle cx="15" cy="12" r="1.4" fill="currentColor"/></svg>
          <span class="tbl-txt">ป้ายกำกับ</span>
        </button>
        <button class="tool-btn" data-tool="net" id="toolNetBtn">
          <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="6" height="6" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="4" width="6" height="6" stroke="currentColor" stroke-width="1.6"/><rect x="9" y="14" width="6" height="6" stroke="currentColor" stroke-width="1.6"/></svg>
          <span class="tbl-txt">รูปคลี่</span>
        </button>
        <button class="tool-btn" data-tool="formula">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 4h14M5 20h14M8 4l8 16M16 4l-8 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span class="tbl-txt">สูตรคำนวณ</span>
        </button>

function cubeVerts(hw,hh,hd){
  const s=[-1,1], out=[];
  for(const x of s) for(const y of s) for(const z of s) out.push([x*hw,y*hh,z*hd]);
  return out;
}
function prismRingVerts(r,halfH,seg){
  const out=[];
  for(const y of [halfH,-halfH]){
    for(let i=0;i<seg;i++){
      const theta = i*(Math.PI*2/seg);
      out.push([r*Math.sin(theta), y, r*Math.cos(theta)]);
    }
  }
  return out;
}
function pyramidVerts(r,halfH,seg){
  const out=[[0,halfH,0]];
  for(let i=0;i<seg;i++){
    const theta = i*(Math.PI*2/seg);
    out.push([r*Math.sin(theta), -halfH, r*Math.cos(theta)]);
  }
  return out;
}

function createUnitGeometry(type){
  switch(type){
    case 'box': return new THREE.BoxGeometry(1,1,1);
    case 'hexPrism': return new THREE.CylinderGeometry(0.5,0.5,1,6,1,false);
    case 'pyramid': { const g=new THREE.ConeGeometry(0.5,1,4,1,false); g.rotateY(Math.PI/4); return g; }
    case 'cylinder': return new THREE.CylinderGeometry(0.5,0.5,1,48,1,false);
    case 'cone': return new THREE.ConeGeometry(0.5,1,48,1,false);
    case 'sphere': return new THREE.SphereGeometry(0.5,48,32);
    default: return new THREE.BoxGeometry(1,1,1);
  }
}

function buildSolidMesh(def){
  const group = new THREE.Group();
  const geo = def.geo();
  const mesh = new THREE.Mesh(geo, faceMaterial);
  group.add(mesh);
  const edges = new THREE.EdgesGeometry(geo, def.edgeAngle);
  group.add(new THREE.LineSegments(edges, edgeMaterialSharp));
  def.verts.forEach(p=>{
    const dot = new THREE.Mesh(vertexGeo, vertexMaterial);
    dot.position.set(p[0],p[1],p[2]);
    group.add(dot);
  });
  return group;
}

function buildCustomMesh(presetId, x, y, z){
  const preset = PRESETS[presetId];
  const geo = createUnitGeometry(preset.geometryType);
  geo.scale(x,y,z);
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    color:preset.color, roughness:.42, metalness:.12,
    flatShading:preset.flatShading, side:THREE.DoubleSide
  });
  const group = new THREE.Group();
  const mesh = new THREE.Mesh(geo, mat);
  group.add(mesh);
  const edges = new THREE.EdgesGeometry(geo, 1);
  group.add(new THREE.LineSegments(edges, edgeMaterialSharp));
  return group;
}

/* ---- animated unfold net (cube / cuboid) ----
   Builds a real hinged net: Front stays fixed, Top/Bottom/Left/Right hinge off
   its four edges, and Back is chained off the outer edge of Right. Calling
   setOpenness(t) with t=0 shows it folded into the solid box shape, t=1 lays
   it out completely flat as a net. */
function buildBoxNet(w,h,d){
  const group = new THREE.Group();
  const panels = [];
  function mat(c){ return new THREE.MeshStandardMaterial({color:c, roughness:.6, metalness:.05, side:THREE.DoubleSide}); }
  function makePanel(pw,ph,color){
    const geo = new THREE.PlaneGeometry(pw,ph);
    const mesh = new THREE.Mesh(geo, mat(color));
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({color:0x1d4ed8})));
    return mesh;
  }

  group.add(makePanel(w,h,0xdbe6ff)); // front (static reference)

  const topPivot = new THREE.Group(); topPivot.position.set(0,h/2,0);
  const topMesh = makePanel(w,d,0xffe3b3); topMesh.position.set(0,d/2,0);
  topPivot.add(topMesh); group.add(topPivot);
  panels.push({obj:topPivot, axis:'x', target:-Math.PI/2});

  const bottomPivot = new THREE.Group(); bottomPivot.position.set(0,-h/2,0);
  const bottomMesh = makePanel(w,d,0xc9f2e6); bottomMesh.position.set(0,-d/2,0);
  bottomPivot.add(bottomMesh); group.add(bottomPivot);
  panels.push({obj:bottomPivot, axis:'x', target:Math.PI/2});

  const leftPivot = new THREE.Group(); leftPivot.position.set(-w/2,0,0);
  const leftMesh = makePanel(d,h,0xf6c9e0); leftMesh.position.set(-d/2,0,0);
  leftPivot.add(leftMesh); group.add(leftPivot);
  panels.push({obj:leftPivot, axis:'y', target:-Math.PI/2});

  const rightPivot = new THREE.Group(); rightPivot.position.set(w/2,0,0);
  const rightMesh = makePanel(d,h,0xd8d1ff); rightMesh.position.set(d/2,0,0);
  rightPivot.add(rightMesh);
  const backHinge = new THREE.Group(); backHinge.position.set(d,0,0);
  const backMesh = makePanel(w,h,0xffd3ad); backMesh.position.set(w/2,0,0);
  backHinge.add(backMesh);
  rightPivot.add(backHinge);
  group.add(rightPivot);
  panels.push({obj:rightPivot, axis:'y', target:Math.PI/2});
  panels.push({obj:backHinge, axis:'y', target:Math.PI/2});

  function setOpenness(t){
    panels.forEach(p=>{
      const angle = p.target*(1-t);
      if(p.axis==='x') p.obj.rotation.x = angle; else p.obj.rotation.y = angle;
    });
  }
  setOpenness(0);
  return {group, setOpenness};
}

const BOX_DIMS = { cube:[1,1,1], cuboid:[1.5,1,1] };
const netCache = {};
const BASE_CAMERA_Z = 4.6, NET_CAMERA_Z = 7.4;

function animateOpenness(net, from, to, onDone){
  const duration = 700;
  const start = performance.now();
  function step(now){
    const p = Math.min(1,(now-start)/duration);
    const eased = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    const t = from + (to-from)*eased;
    net.setOpenness(t);
    camera.position.z = BASE_CAMERA_Z + (NET_CAMERA_Z-BASE_CAMERA_Z)*t;
    if(p<1) requestAnimationFrame(step); else if(onDone) onDone();
  }
  requestAnimationFrame(step);
}

/* ---- rotate and zoom 3D solids with mouse or touch ---- */
let dragging=false;
const activePointers = new Map();
let lastPinchDistance = null;
const MIN_CAMERA_Z = 2.2, MAX_CAMERA_Z = 12;

function clampCameraZoom(z){
  return Math.max(MIN_CAMERA_Z, Math.min(MAX_CAMERA_Z, z));
}
function zoomCamera(amount){
  camera.position.z = clampCameraZoom(camera.position.z + amount);
}
function pointerDistance(){
  const pointers = [...activePointers.values()];
  if(pointers.length < 2) return null;
  return Math.hypot(pointers[0].x-pointers[1].x, pointers[0].y-pointers[1].y);
}

canvas.addEventListener('pointerdown', e=>{
  if(currentDim!=='3d' || !currentShapeId) return;
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  canvas.setPointerCapture(e.pointerId);
  dragging = activePointers.size === 1;
  lastPinchDistance = pointerDistance();
  if(dragging) canvas.classList.add('grabbing');
});

canvas.addEventListener('pointermove', e=>{
  if(!activePointers.has(e.pointerId)) return;
  const previous = activePointers.get(e.pointerId);
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(activePointers.size >= 2){
    const distance = pointerDistance();
    if(lastPinchDistance !== null && distance !== null) zoomCamera((lastPinchDistance-distance)*.012);
    lastPinchDistance = distance;
    dragging = false;
    canvas.classList.remove('grabbing');
    return;
  }

  if(!dragging) return;
  const dx=e.clientX-previous.x, dy=e.clientY-previous.y;
  mainGroup.rotation.y += dx*.008;
  mainGroup.rotation.x += dy*.008;
});

function stopPointer(e){
  activePointers.delete(e.pointerId);
  if(canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  lastPinchDistance = pointerDistance();
  dragging = activePointers.size === 1;
  if(!dragging) canvas.classList.remove('grabbing');
}
canvas.addEventListener('pointerup', stopPointer);
canvas.addEventListener('pointercancel', stopPointer);
canvas.addEventListener('wheel', e=>{
  if(currentDim==='3d' && currentShapeId){
    e.preventDefault();
    zoomCamera(e.deltaY*.008);
  }
},{passive:false});

/* ---- render loop ---- */
const clock = new THREE.Clock();
function animate(){
  if(!renderer.xr.isPresenting) requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if(!currentShapeId){
    idleMeshes.forEach(m=>{
      m.rotation.x += .003+m.userData.speedX*0.002;
      m.rotation.y += .004+m.userData.speedY*0.002;
      m.position.y += Math.sin(t*0.6+m.userData.phase)*0.0018;
    });
  } else if(!dragging){
    mainGroup.rotation.y += 0.0032;
  }
  if(renderer.xr.isPresenting){
    const frame = renderer.xr.getFrame();
    if(frame && arHitTestSource && arReferenceSpace){
      const hits = frame.getHitTestResults(arHitTestSource);
      if(hits.length){
        const pose = hits[0].getPose(arReferenceSpace);
        reticle.matrix.fromArray(pose.transform.matrix);
        reticle.visible = !arPlaced;
      } else {
        reticle.visible = false;
      }
    }
  }
  renderer.render(scene,camera);
  positionLabels();
}
animate();

/* Real WebXR AR mode with hit-test placement. */
const arModeBtn = document.getElementById('arModeBtn');
const arHint = document.getElementById('arHint');
let arBusy = false;

function showARMessage(message){
  arHint.textContent = message;
  arHint.classList.add('show');
}
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=>setTimeout(()=>reject(new Error('AR request timed out')), ms))
  ]);
}

function resetARState(){
  arSession = null;
  arHitTestSource = null;
  arReferenceSpace = null;
  arPlaced = false;
  reticle.visible = false;
  arHint.classList.remove('show');
  arModeBtn.classList.remove('on');
  arModeBtn.setAttribute('aria-pressed','false');
  arModeBtn.lastChild.textContent = ' เข้าสู่โหมด AR';
  mainGroup.visible = true;
  idleGroup.visible = !currentShapeId;
  renderer.setAnimationLoop(null);
  requestAnimationFrame(animate);
}

async function enterAR(){
  if(arBusy) return;
  if(currentDim!=='3d' || !currentShapeId || currentShapeId==='custom' && !currentSolidGroup){
    showARMessage('กรุณาเลือกรูปทรง 3 มิติก่อนเข้าสู่โหมด AR');
    return;
  }
  if(!navigator.xr){
    showARMessage('อุปกรณ์นี้ไม่รองรับ WebXR AR กรุณาใช้ Chrome บน Android ที่รองรับ ARCore');
    return;
  }
  arBusy = true;
  arModeBtn.disabled = true;
  showARMessage('กำลังเปิดกล้อง AR... กรุณารอสักครู่');
  try{
    renderer.xr.setReferenceSpaceType('local-floor');
    const supported = await withTimeout(navigator.xr.isSessionSupported('immersive-ar'),8000);
    if(!supported) throw new Error('immersive-ar is not supported');
    arSession = await withTimeout(navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['hit-test'],
      optionalFeatures:['dom-overlay','local-floor'],
      domOverlay:{root:document.body}
    }),12000);
    arSession.addEventListener('end', resetARState);
    arSession.addEventListener('select', ()=>{
      if(!reticle.visible) return;
      mainGroup.position.setFromMatrixPosition(reticle.matrix);
      mainGroup.quaternion.setFromRotationMatrix(reticle.matrix);
      mainGroup.visible = true;
      arPlaced = true;
      reticle.visible = false;
      arHint.textContent = 'แตะพื้นจุดใหม่เพื่อย้ายโมเดล หรือกดปุ่ม AR เพื่อออก';
    });
    await renderer.xr.setSession(arSession);
    arReferenceSpace = await arSession.requestReferenceSpace('local-floor').catch(()=>arSession.requestReferenceSpace('local'));
    const viewerSpace = await arSession.requestReferenceSpace('viewer');
    arHitTestSource = await arSession.requestHitTestSource({space:viewerSpace});
    arPlaced = false;
    mainGroup.visible = false;
    idleGroup.visible = false;
    arHint.textContent = 'เล็งกล้องไปที่พื้น แล้วแตะเพื่อวางโมเดล';
    arHint.classList.add('show');
    arModeBtn.classList.add('on');
    arModeBtn.setAttribute('aria-pressed','true');
    arModeBtn.lastChild.textContent = ' ออกจากโหมด AR';
    renderer.setAnimationLoop(animate);
  }catch(err){
    if(arSession) await arSession.end().catch(()=>{});
    resetARState();
    showARMessage('เปิด AR ไม่สำเร็จ: อนุญาตกล้องและเปิดเว็บผ่าน HTTPS แล้วลองใหม่');
  } finally {
    arBusy = false;
    arModeBtn.disabled = false;
  }
}

async function toggleARMode(){
  if(arSession){
    await arSession.end();
    return;
  }
  await enterAR();
}
arModeBtn.addEventListener('click', toggleARMode);

const labelLayer = document.getElementById('labelLayer');
let chipAnchors = [];
function setupLabelsFor(def){
  labelLayer.innerHTML='';
  chipAnchors = [];
  const specs = [
    {key:'E', cls:'edge', title:'(Edge)', val:def.E, anchor:new THREE.Vector3(-.55,1.05,0)},
    {key:'V', cls:'vertex', title:'(Vertex)', val:def.V, anchor:new THREE.Vector3(.85,.85,0)},
    {key:'F', cls:'face', title:'(Face)', val:def.F, anchor:new THREE.Vector3(0,0,0)}
  ];
  specs.forEach(s=>{
    const chip=document.createElement('div');
    chip.className='chip '+s.cls;
    chip.innerHTML = `<small>${s.title}</small>${s.val}`;
    labelLayer.appendChild(chip);
    chipAnchors.push({el:chip, anchor:s.anchor});
  });
}
/* label chips for a custom-built model — show the X, Y, Z lengths instead of V/E/F */
function setupCustomLabels(x,y,z){
  labelLayer.innerHTML='';
  chipAnchors = [];
  const specs = [
    {cls:'edge',   title:'X', val:fmt(x), anchor:new THREE.Vector3(0, -(y/2)-.35, (z/2)+.15)},
    {cls:'vertex', title:'Y', val:fmt(y), anchor:new THREE.Vector3((x/2)+.5, 0, (z/2)+.15)},
    {cls:'face',   title:'Z', val:fmt(z), anchor:new THREE.Vector3(0, (y/2)+.35, 0)}
  ];
  specs.forEach(s=>{
    const chip=document.createElement('div');
    chip.className='chip '+s.cls;
    chip.innerHTML = `<small>${s.title}</small>${s.val}`;
    labelLayer.appendChild(chip);
    chipAnchors.push({el:chip, anchor:s.anchor});
  });
}
function positionLabels(){
  if(!labelsOn || !currentShapeId || currentDim!=='3d') return;
  const rect = canvas.getBoundingClientRect();
  chipAnchors.forEach(c=>{
    const v = c.anchor.clone();
    mainGroup.localToWorld(v);
    v.project(camera);
    const x = (v.x*.5+.5)*rect.width;
    const y = (1-(v.y*.5+.5))*rect.height;
    c.el.style.left = x+'px';
    c.el.style.top = y+'px';
  });
}

/* =====================================================================
   2D RENDERING (SVG)
===================================================================== */
function regularPolygonPoints(n, r, cx, cy){
  const pts=[];
  for(let i=0;i<n;i++){
    const a = -Math.PI/2 + i*(Math.PI*2/n);
    pts.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]);
  }
  return pts.map(p=>p.join(',')).join(' ');
}
function render2DShape(id){
  const def = SHAPES_2D[id];
  let inner='';
  if(def.kind==='circle'){
    inner = `<circle cx="110" cy="110" r="82" fill="rgba(127,178,255,.14)" stroke="#7fb2ff" stroke-width="4"/>`;
  } else if(def.kind==='rect'){
    inner = `<rect x="22" y="55" width="176" height="110" fill="rgba(246,185,59,.14)" stroke="#f6b93b" stroke-width="4"/>`;
  } else {
    inner = `<polygon points="${regularPolygonPoints(def.n,82,110,110)}" fill="rgba(167,139,250,.14)" stroke="#a78bfa" stroke-width="4" stroke-linejoin="round"/>`;
  }
  svgFlipEl.innerHTML = `<svg viewBox="0 0 220 220">${inner}</svg>`;
  rotY2D = 0;
  svgFlipEl.style.transform = 'rotateY(0deg)';
}

/* =====================================================================
   SHAPE SELECTION
===================================================================== */
function selectShape(id){
  currentShapeId = id;
  closeMobileSidebar();
  renderSidebar();
  idleOverlay.classList.add('hidden');
  idleGroup.visible = false;
  closeSidePanel();
  resetNetView();
  document.querySelector('.toolbar').classList.add('show');

  /* ---- custom 3D model builder ---- */
  if(id==='custom'){
    document.getElementById('toolBuildBtn').style.display='';
    svgStage.classList.add('hidden');
    canvas.style.display='block';
    mainGroup.clear();
    mainGroup.rotation.set(0,0,0);
    camera.position.z = BASE_CAMERA_Z;
    currentSolidGroup = null;
    labelLayer.classList.remove('show');
    document.getElementById('toolLabelBtn').style.display='';
    document.getElementById('toolNetBtn').style.display='';
    if(customPresetId){
      rebuildCustomModel();
    } else {
      updateCustomToolbarState();
    }
    openPanel('build');
    return;
  }
  document.getElementById('toolBuildBtn').style.display='none';

  if(currentDim==='3d'){
    svgStage.classList.add('hidden');
    canvas.style.display='block';
    mainGroup.clear();
    mainGroup.rotation.set(0,0,0);
    camera.position.z = BASE_CAMERA_Z;
    const def = SHAPES_3D[id];
    currentSolidGroup = buildSolidMesh(def);
    mainGroup.add(currentSolidGroup);
    setupLabelsFor(def);
    labelLayer.classList.toggle('show', labelsOn);
    document.getElementById('toolLabelBtn').style.display='';
    document.getElementById('toolNetBtn').style.display='';
    document.querySelector('.tool-btn[data-tool="net"]').disabled = false;
    document.querySelector('.tool-btn[data-tool="formula"]').disabled = false;
    document.querySelector('.tool-btn[data-tool="info"]').disabled = false;
  } else {
    canvas.style.display='none';
    svgStage.classList.remove('hidden');
    render2DShape(id);
    labelLayer.classList.remove('show');
    document.getElementById('toolLabelBtn').style.display='none';
    document.getElementById('toolNetBtn').style.display='none';
  }
  if(activeTool) openPanel(activeTool);
}

/* =====================================================================
   TOOLBAR + SIDE PANEL
===================================================================== */
const sidePanel = document.getElementById('sidePanel');
const panelBody = document.getElementById('panelBody');

function fmtStats(def){
  return `<div class="stat-row">
    <div class="stat-pill"><b>${def.V}</b><span>จุดยอด</span></div>
    <div class="stat-pill"><b>${def.E}</b><span>ขอบ</span></div>
    <div class="stat-pill"><b>${def.F}</b><span>หน้า</span></div>
  </div>`;
}

function openPanel(tool){
  if(tool!=='build' && !currentShapeId){ return; }
  activeTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.toggle('on', b.dataset.tool===tool));

  /* ---- builder panel (choose preset + set X/Y/Z) ---- */
  if(tool==='build'){
    renderBuilderPanel();
    sidePanel.classList.add('open');
    return;
  }

  const is3d = currentDim==='3d';
  const isCustom = currentShapeId==='custom';
  const def = isCustom ? (customPresetId ? PRESETS[customPresetId] : null)
                       : (is3d ? SHAPES_3D[currentShapeId] : SHAPES_2D[currentShapeId]);

  if(tool==='info'){
    if(isCustom){
      panelBody.innerHTML = !def
        ? `<h2>ยังไม่ได้เลือกรูปทรง</h2><p class="desc-text">กรุณาเลือกรูปทรงสำเร็จรูปและกำหนดขนาดแกน X, Y, Z ก่อน</p>`
        : `<h2>${def.th}</h2>
           <div class="subtitle">ขนาดที่กำหนด — X=${fmt(customAxis.x)}, Y=${fmt(customAxis.y)}, Z=${fmt(customAxis.z)} หน่วย</div>
           <div class="stat-row">
             <div class="stat-pill"><b>${def.vertices}</b><span>จุดยอด</span></div>
             <div class="stat-pill"><b>${def.edges}</b><span>ขอบ</span></div>
             <div class="stat-pill"><b>${def.faces}</b><span>หน้า</span></div>
           </div>
           <div class="panel-section"><h3>เกี่ยวกับรูปทรงนี้</h3><p class="desc-text">${def.description}</p></div>
           <div class="panel-section"><h3>ตัวอย่างในชีวิตประจำวัน</h3><p class="desc-text">${def.examples}</p></div>`;
    } else {
      panelBody.innerHTML = `
        <h2>${def.name}</h2>
        <div class="subtitle">${def.en}</div>
        ${is3d?fmtStats(def):''}
        <div class="panel-section">
          <h3>เกี่ยวกับรูปทรงนี้</h3>
          <p class="desc-text">${def.desc}</p>
        </div>`;
    }
  } else if(tool==='formula'){
    if(isCustom){
      panelBody.innerHTML = !def
        ? `<h2>ยังไม่ได้เลือกรูปทรง</h2><p class="desc-text">กรุณาเลือกรูปทรงสำเร็จรูปและกำหนดขนาดแกน X, Y, Z ก่อน</p>`
        : (()=>{
            const rows = def.formulas(customAxis.x, customAxis.y, customAxis.z)
              .map(f=>`<div class="formula-box"><span class="fname">${f[0]}</span>${f[1]}</div>`).join('');
            return `<h2>สูตรคำนวณ</h2><div class="subtitle">${def.formulaTitle}</div>${rows}`;
          })();
    } else {
      panelBody.innerHTML = `
        <h2>สูตรคำนวณ</h2>
        <div class="subtitle">${def.name}</div>
        ${is3d?`
        <div class="formula-box"><span class="fname">ปริมาตร</span>${def.volume}</div>
        <div class="formula-box"><span class="fname">พื้นที่ผิว</span>${def.area}</div>`:`
        <div class="formula-box"><span class="fname">เส้นรอบรูป</span>${def.perimeter}</div>
        <div class="formula-box"><span class="fname">พื้นที่</span>${def.area}</div>
        <div class="formula-box"><span class="fname">ผลรวมมุมภายใน</span>${def.angleSum}</div>`}`;
    }
  } else if(tool==='net'){
    if(isCustom){
      panelBody.innerHTML = !def
        ? `<h2>ยังไม่ได้เลือกรูปทรง</h2><p class="desc-text">กรุณาเลือกรูปทรงสำเร็จรูปและกำหนดขนาดแกน X, Y, Z ก่อน</p>`
        : `<h2>รูปคลี่</h2>
           <div class="subtitle">${def.th}</div>
           <div class="net-visual">${netSVG(def.netKey)}</div>
           <p class="desc-text">${def.net}</p>`;
    } else {
      panelBody.innerHTML = `
        <h2>รูปคลี่</h2>
        <div class="subtitle">${def.name}</div>
        <div class="net-visual">${netSVG(currentShapeId)}</div>
        <p class="desc-text">${def.net}</p>`;
    }
  } else if(tool==='label'){
    labelsOn = !labelsOn;
    labelLayer.classList.toggle('show', labelsOn && is3d);
    document.querySelector('.tool-btn[data-tool="label"]').classList.toggle('on', labelsOn);
    activeTool = null;
    return;
  }
  sidePanel.classList.add('open');
}
function closeSidePanel(){
  sidePanel.classList.remove('open');
  activeTool=null;
  document.querySelectorAll('.tool-btn').forEach(b=>{ if(b.dataset.tool!=='label') b.classList.remove('on'); });
}
document.getElementById('panelClose').addEventListener('click', closeSidePanel);

document.querySelectorAll('.tool-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const tool = btn.dataset.tool;
    if(tool==='label'){ openPanel('label'); return; }
    if(tool==='net' && currentDim==='3d' && BOX_DIMS[currentShapeId]){
      toggleBoxNet();
      return;
    }
    if(activeTool===tool){ closeSidePanel(); return; }
    openPanel(tool);
  });
});

/* =====================================================================
   CUSTOM MODEL BUILDER PANEL (preset picker + X/Y/Z inputs)
===================================================================== */
function renderBuilderPanel(){
  const presetPillsHtml = presetOrder.map(id=>
    `<button class="preset-pill${id===customPresetId?' active':''}" data-preset="${id}">${PRESETS[id].th}</button>`
  ).join('');

  let axisHtml;
  if(customPresetId){
    axisHtml = `
      <div class="selected-tag">✓ รูปทรงที่เลือก: ${PRESETS[customPresetId].th}</div>
      <div class="axis-label">ขั้นที่ 2 — กำหนดขนาดแกน X, Y, Z ของรูปทรงที่เลือก</div>
      <div class="axis-row">
        <div><label>แกน X</label><input type="number" id="axisX" value="${customAxis.x}" step="0.5" min="1" max="10"/></div>
        <div><label>แกน Y</label><input type="number" id="axisY" value="${customAxis.y}" step="0.5" min="1" max="10"/></div>
        <div><label>แกน Z</label><input type="number" id="axisZ" value="${customAxis.z}" step="0.5" min="1" max="10"/></div>
      </div>
      <button class="generate-btn" id="genBtn">⚙️ สร้างโมเดล</button>
      <div class="axis-error" id="axisError"></div>
      <div class="axis-hint">กำหนดความยาวของแกน X, Y และ Z (1-10 หน่วย) ของรูปทรงที่เลือกไว้ แล้วกด "สร้างโมเดล" ระบบจะสร้างรูปทรงสามมิติให้ตามขนาดที่กำหนดทันที</div>`;
  } else {
    axisHtml = `<div class="select-hint">👆 กรุณาเลือกรูปทรงด้านบนก่อน จากนั้นระบบจะเปิดให้คุณกำหนดขนาดแกน X, Y, Z ของรูปทรงนั้นเอง</div>`;
  }

  panelBody.innerHTML = `
    <h2>📐 สร้างโมเดล 3 มิติ</h2>
    <div class="subtitle">ขั้นที่ 1 — เลือกรูปทรงสำเร็จรูปก่อน</div>
    <div class="preset-row">${presetPillsHtml}</div>
    ${axisHtml}`;

  panelBody.querySelectorAll('.preset-pill').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      customPresetId = btn.dataset.preset;
      renderBuilderPanel();
      rebuildCustomModel();
      if(sidePanel.classList.contains('open') && activeTool==='build'){
        // stay on the builder panel; nothing else to do
      }
    });
  });

  if(customPresetId){
    document.getElementById('genBtn').addEventListener('click', generateCustomModel);
    ['axisX','axisY','axisZ'].forEach(id=>{
      document.getElementById(id).addEventListener('input', validateAxisInputs);
    });
  }
}

function validateAxisInputs(){
  const ids = ['axisX','axisY','axisZ'];
  let ok = true;
  ids.forEach(id=>{
    const el = document.getElementById(id);
    const v = parseFloat(el.value);
    const valid = !isNaN(v) && v>=1 && v<=10;
    el.classList.toggle('invalid', !valid);
    if(!valid) ok = false;
  });
  const err = document.getElementById('axisError');
  if(!ok){ err.textContent = '⚠️ กรุณากรอกขนาดแกนให้อยู่ระหว่าง 1-10 หน่วยเท่านั้น'; err.style.display='block'; }
  else { err.style.display = 'none'; }
  return ok;
}

function generateCustomModel(){
  if(!customPresetId) return;
  if(!validateAxisInputs()) return;
  customAxis.x = parseFloat(document.getElementById('axisX').value);
  customAxis.y = parseFloat(document.getElementById('axisY').value);
  customAxis.z = parseFloat(document.getElementById('axisZ').value);
  rebuildCustomModel();
}
