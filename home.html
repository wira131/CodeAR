<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>หน้าแรก - สื่อการเรียนรู้ WebAR เรขาคณิตสามมิติ</title>

  <!-- Google Fonts: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Prompt', sans-serif;
      background: #0b1220;
      color: #fff;
      overflow: hidden;
    }

    /* ครอบทั้งหน้าให้คลิก/แตะได้ทั้งหมด */
    .page-link {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      text-decoration: none;
      color: inherit;
      position: relative;
      z-index: 10;
      cursor: pointer;
      padding: 20px;
    }

    /* Background Gradient */
    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #020617 85%);
    }

    /* Geometry Decorative Elements - Left & Right */
    .geo-shape {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      opacity: 0.85;
      filter: drop-shadow(0 10px 20px rgba(59, 130, 246, 0.3));
    }

    .geo-left {
      top: 15%;
      left: 8%;
      width: 140px;
      height: 140px;
      animation: floatLeft 6s ease-in-out infinite alternate;
    }

    .geo-right {
      top: 18%;
      right: 8%;
      width: 150px;
      height: 150px;
      animation: floatRight 7s ease-in-out infinite alternate;
    }

    @keyframes floatLeft {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      100% { transform: translateY(-20px) rotate(15deg) scale(1.05); }
    }

    @keyframes floatRight {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      100% { transform: translateY(-25px) rotate(-15deg) scale(1.08); }
    }

    /* Main Title Section */
    .content {
      text-align: center;
      max-width: 800px;
      position: relative;
      z-index: 5;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.4;
      margin: 0 0 24px;
      background: linear-gradient(135deg, #ffffff 0%, #60a5fa 50%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(59, 130, 246, 0.2);
    }

    /* Tap Instruction Prompt */
    .tap-hint {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      color: #93c5fd;
      font-weight: 400;
      padding: 12px 28px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(96, 165, 250, 0.3);
      border-radius: 30px;
      backdrop-filter: blur(8px);
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
        transform: scale(1.03);
      }
    }

    .tap-hint svg {
      animation: pointRight 1s infinite alternate;
    }

    @keyframes pointRight {
      0% { transform: translateX(0); }
      100% { transform: translateX(5px); }
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      .geo-left {
        width: 90px;
        height: 90px;
        top: 8%;
        left: 4%;
      }
      .geo-right {
        width: 95px;
        height: 95px;
        top: 10%;
        right: 4%;
      }
      .tap-hint {
        font-size: 0.95rem;
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-gradient"></div>

  <!-- แตะตรงไหนก็ได้ในหน้านี้ จะเปลี่ยนไปยัง geometry.html -->
  <a href="geometry2.html" class="page-link">
    
    <!-- ภาพประกอบเรขาคณิต มุมซ้าย (Geometric Shapes 3D-style) -->
    <svg class="geo-shape geo-left" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Cube representation -->
      <path d="M100 20 L165 55 L165 125 L100 160 L35 125 L35 55 Z" fill="url(#grad1)" opacity="0.8"/>
      <path d="M100 20 L165 55 L100 95 L35 55 Z" fill="#60a5fa" opacity="0.6"/>
      <path d="M100 95 L165 55 L165 125 L100 160 Z" fill="#2563eb" opacity="0.7"/>
      <!-- Sphere Ring -->
      <ellipse cx="100" cy="90" rx="75" ry="25" stroke="#93c5fd" stroke-width="3" stroke-dasharray="6 6"/>
      <defs>
        <linearGradient id="grad1" x1="35" y1="20" x2="165" y2="160" gradientUnits="userSpaceOnUse">
          <stop stop-color="#3b82f6"/>
          <stop offset="1" stop-color="#1d4ed8"/>
        </linearGradient>
      </defs>
    </svg>

    <!-- ภาพประกอบเรขาคณิต มุมขวา (Pyramid & Cone Mesh) -->
    <svg class="geo-shape geo-right" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Pyramid representation -->
      <polygon points="100,20 170,140 100,170" fill="#a78bfa" opacity="0.7"/>
      <polygon points="100,20 30,140 100,170" fill="#8b5cf6" opacity="0.9"/>
      <polygon points="100,20 30,140 170,140" fill="#c4b5fd" opacity="0.3"/>
      <!-- Wireframe lines -->
      <line x1="100" y1="20" x2="100" y2="170" stroke="#f472b6" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="100" cy="20" r="6" fill="#f472b6"/>
    </svg>

    <div class="content">
      <h1>Geometry Learning with WEB AR</h1>
  
      <div class="tap-hint">
        <span>เข้าสู่ระบบ</span>
      </div>
    </div>

  </a>

</body>
</html>
